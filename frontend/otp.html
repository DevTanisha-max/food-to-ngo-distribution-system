<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodShare - Verify OTP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 50%, #0c4a6e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            text-align: center;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon { font-size: 3rem; margin-bottom: 1rem; }

        h2 {
            color: white;
            margin-bottom: 0.5rem;
        }

        p {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            color: white;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 8px;
            margin-bottom: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        button {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            border: none;
            border-radius: 1rem;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="logo-icon">🔐</div>
        <h2>Verify OTP</h2>
        <p>Enter the 4-digit code sent to you</p>
        <input type="number" id="order_id" placeholder="Order ID">
        <input type="text" id="otp" placeholder="0000" maxlength="4">
        <button onclick="verifyOTP()">Verify & Complete Pickup →</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
