<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Food Distribution</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .otp-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .otp-input {
            width: 100%;
            padding: 12px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin: 20px 0;
        }
        .btn-verify {
            background: #4CAF50;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-verify:hover {
            background: #45a049;
        }
        .order-id-input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="otp-container">
        <h2>Verify OTP</h2>
        <p>Enter the OTP you received</p>
        
        <label>Order ID:</label>
        <input type="number" id="order_id" class="order-id-input" placeholder="Enter Order ID">
        
        <label>OTP:</label>
        <input type="text" id="otp" class="otp-input" placeholder="0000" maxlength="4">
        
        <button class="btn-verify" onclick="verifyOTP()">Verify OTP</button>
        
        <p style="margin-top: 20px; font-size: 12px; color: #666;">
            Didn't receive OTP? Check the alert when placing order.
        </p>
    </div>

    <script src="script.js"></script>
    
    <script>
        console.log("OTP page loaded");
        
        // Add Enter key support
        const otpInput = document.getElementById("otp");
        if (otpInput) {
            otpInput.addEventListener("keypress", function(e) {
                if (e.key === "Enter") {
                    verifyOTP();
                }
            });
        }
    </script>
</body>
</html>
