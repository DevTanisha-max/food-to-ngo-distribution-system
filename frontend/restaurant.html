<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodShare - Restaurant Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .dashboard-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .welcome-card {
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            border-radius: 1.5rem;
            padding: 2rem;
            color: white;
            margin-bottom: 2rem;
        }

        .add-food-card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .add-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <nav>
        <h1>🍽️ FoodShare</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>

    <div class="dashboard-wrapper">
        <div class="welcome-card">
            <h2>Welcome, <span id="restaurantName">Restaurant</span>! 🍕</h2>
            <p>Share your surplus food and make a difference.</p>
        </div>

        <div class="add-food-card">
            <h3>➕ Add Surplus Food</h3>
            <div class="form-grid">
                <input type="text" id="food_name" placeholder="Food Name">
                <input type="text" id="food_type" placeholder="Food Type (Veg/Non-Veg)">
                <input type="number" id="shelf" placeholder="Shelf Life (hours)">
                <select id="dry">
                    <option value="dry">Dry Food</option>
                    <option value="wet">Wet Food</option>
                </select>
                <input type="number" id="cal" placeholder="Calorific Value">
                <input type="number" id="smu" placeholder="SMU Equivalent">
                <input type="number" id="qty" placeholder="Quantity Available (SMU)">
            </div>
            <button class="add-btn" onclick="addFood()">Add Food →</button>
        </div>

        <h3>📋 Your Food Listings</h3>
        <div id="food-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
