<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodShare - NGO Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Additional dashboard styles */
        .dashboard-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .welcome-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 1.5rem;
            padding: 2rem;
            color: white;
            margin-bottom: 2rem;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            background: white;
            border-radius: 1rem;
            padding: 1.2rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .food-card {
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .food-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .food-image {
            height: 150px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .food-info {
            padding: 1.2rem;
        }

        .food-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .food-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: #6b7280;
            font-size: 0.85rem;
        }

        .smu-badge {
            background: #10b981;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .request-btn {
            width: 100%;
            padding: 0.6rem;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s;
        }

        .request-btn:hover {
            transform: scale(0.98);
        }
    </style>
</head>
<body onload="loadFood()">
    <nav>
        <h1>🍽️ FoodShare</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>

    <div class="dashboard-wrapper">
        <div class="welcome-card">
            <h2>Welcome, <span id="ngoName">NGO</span>! 👋</h2>
            <p>Browse and request surplus food donations from verified restaurants.</p>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-number" id="totalRequested">0</div>
                <div>Total SMU Requested</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="remainingSMU">0</div>
                <div>Remaining Capacity</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="ordersCompleted">0</div>
                <div>Orders Completed</div>
            </div>
        </div>

        <h2 style="margin-bottom: 1rem;">🍕 Available Food Donations</h2>
        <div id="food-list" class="food-grid"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
