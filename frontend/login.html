<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food to NGO Network</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="auth-body">

  <!-- Background animation -->
  <div class="bg-blobs">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
  </div>

  <div class="auth-container">

    <!-- LEFT PANEL -->
    <div class="auth-left">
      <h1>🌱 Food Redistribution Network</h1>
      <p class="tagline">
        Reducing food waste. Feeding communities. Connecting impact.
      </p>

      <div class="impact-box">
        <div>🍱 Surplus Food → NGOs</div>
        <div>⚡ Real-time distribution</div>
        <div>📦 Transparent logistics</div>
      </div>
    </div>

    <!-- RIGHT LOGIN CARD -->
    <div class="auth-card">

      <h2>Welcome Back 👋</h2>
      <p class="subtitle">Login to continue</p>

      <input id="email" type="email" placeholder="Email address" />
      <input id="password" type="password" placeholder="Password" />

      <button id="loginBtn" onclick="login()">
        Login
      </button>

      <p class="bottom-text">
        Don’t have an account?
        <a href="signup.html">Sign up</a>
      </p>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
