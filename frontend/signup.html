<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodShare - Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 50%, #0c4a6e 100%);
            position: relative;
            overflow-x: hidden;
        }

        .bg-shape {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 { background: #8b5cf6; top: -100px; left: -100px; }
        .shape-2 { background: #06b6d4; bottom: -100px; right: -100px; animation-delay: 5s; }
        .shape-3 { background: #ec4899; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; height: 400px; animation-delay: 10s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-icon { font-size: 2.5rem; }
        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #fff, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.8rem;
            margin-bottom: 0.3rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
        }

        input, select {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            color: white;
            font-size: 0.9rem;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #8b5cf6;
            background: rgba(255, 255, 255, 0.15);
        }

        .role-toggle {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .role-btn {
            flex: 1;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            color: white;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .role-btn.active {
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            border-color: transparent;
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload input {
            padding: 0.8rem;
            cursor: pointer;
        }

        .signup-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            border: none;
            border-radius: 1rem;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(139, 92, 246, 0.5);
        }

        .login-link {
            text-align: center;
            margin-top: 1rem;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
        }

        .login-link a {
            color: #a78bfa;
            text-decoration: none;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .glass-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="container">
        <div class="glass-card">
            <div class="logo">
                <div class="logo-icon">🍽️</div>
                <h1>Create Account</h1>
            </div>

            <div class="role-toggle">
                <div class="role-btn active" onclick="setRole('restaurant')">🍕 Restaurant</div>
                <div class="role-btn" onclick="setRole('ngo')">🏢 NGO</div>
            </div>

            <form id="signupForm" onsubmit="signup(event)">
                <div class="input-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="name" placeholder="Enter your name" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📧</span>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" placeholder="Create a password" required>
                    </div>
                </div>

                <div id="ngoField" class="hidden">
                    <div class="input-group">
                        <label>Total SMU Capacity</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📊</span>
                            <input type="number" id="capacity" placeholder="Enter total capacity">
                        </div>
                    </div>
                </div>

                <div id="restaurantField" class="hidden">
                    <div class="input-group">
                        <label>Upload Certificate (PDF, JPG, PNG)</label>
                        <div class="file-upload">
                            <input type="file" id="certificate" accept=".pdf,.jpg,.jpeg,.png">
                        </div>
                    </div>
                </div>

                <button type="submit" class="signup-btn">Create Account →</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let currentRole = 'restaurant';

        function setRole(role) {
            currentRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const ngoField = document.getElementById('ngoField');
            const restaurantField = document.getElementById('restaurantField');
            
            if (role === 'ngo') {
                ngoField.classList.remove('hidden');
                restaurantField.classList.add('hidden');
            } else {
                ngoField.classList.add('hidden');
                restaurantField.classList.remove('hidden');
            }
        }

        // Initialize with restaurant selected
        document.getElementById('restaurantField').classList.remove('hidden');
    </script>
</body>
</html>
